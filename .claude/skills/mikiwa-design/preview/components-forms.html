<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);}
  body{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-width:560px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:13px;font-weight:600;color:var(--fg-1);}
  .input,select,textarea{font-family:var(--font-body);font-size:14px;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface);color:var(--fg-1);outline:none;transition:border-color var(--dur-micro),box-shadow var(--dur-micro);}
  .input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--shadow-focus);}
  .help{font-size:12px;color:var(--fg-4);}
  .err{font-size:12px;color:var(--danger);font-weight:600;}
  .input.error{border-color:var(--danger);}
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-1);}
  .check input{accent-color:var(--accent);width:16px;height:16px;}
</style>
</head>
<body>
<div class="field">
  <label for="n">Name des Kindes</label>
  <input class="input" id="n" placeholder="z.B. Lena Huber" value="Lena Huber"/>
</div>
<div class="row">
  <div class="field">
    <label for="g">Gruppe</label>
    <select id="g"><option>Sonnenblume</option><option>Marienkäfer</option></select>
  </div>
  <div class="field">
    <label for="d">Geburtsdatum</label>
    <input class="input" id="d" type="date" value="2021-09-14"/>
  </div>
</div>
<div class="field">
  <label for="e">E-Mail der Eltern</label>
  <input class="input error" id="e" value="lena@huber"/>
  <span class="err">Bitte geben Sie eine gültige E-Mail-Adresse an.</span>
</div>
<label class="check"><input type="checkbox" checked/> Newsletter abonnieren</label>
</body>
</html>
