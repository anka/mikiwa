<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);}
  body{padding:24px;box-sizing:border-box;display:flex;gap:16px;flex-wrap:wrap;}
  .card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px;width:280px;display:flex;flex-direction:column;gap:10px;}
  .card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .title{font-weight:700;color:var(--fg-1);font-size:16px;}
  .sub{font-size:13px;color:var(--fg-3);}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--success-soft);color:var(--success);}
  .stat{display:flex;align-items:baseline;gap:6px;}
  .stat .num{font-family:var(--font-display);font-size:32px;font-weight:800;color:var(--fg-1);letter-spacing:-0.02em;}
  .stat .of{color:var(--fg-3);font-size:14px;font-weight:600;}
  .bar{height:6px;background:var(--surface-sunken);border-radius:999px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--accent);width:78%;border-radius:999px;}
  .meta{font-size:12px;color:var(--fg-4);}
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="title">Anwesenheit heute</div><span class="badge">live</span></div>
  <div class="stat"><span class="num">14</span><span class="of">/ 18 Kinder</span></div>
  <div class="bar"><i></i></div>
  <div class="meta">4 Kinder noch nicht eingetragen · 09:12</div>
</div>
<div class="card">
  <div class="row"><div class="title">Sommerfest</div><span class="badge" style="background:var(--accent-soft);color:var(--sun-800)">Sa, 27.06.</span></div>
  <div class="sub">Gartenfest mit Eltern und Kindern. Anmeldung bis 20.06.</div>
  <div class="row" style="margin-top:4px"><span class="meta">12 zugesagt</span><span class="meta">3 unentschieden</span></div>
</div>
</body>
</html>
