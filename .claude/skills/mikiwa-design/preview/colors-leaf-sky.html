<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);}
  body{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;}
  .group{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;gap:6px;}
  .label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);}
  .sw{width:54px;height:48px;border-radius:8px;border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--fg-1);}
  .sw.dark{color:var(--warm-50);}
</style>
</head>
<body>
<div class="group">
  <div class="label">Wiesengrün · secondary, success, growth</div>
  <div class="row">
    <div class="sw" style="background:var(--leaf-50)">50</div>
    <div class="sw" style="background:var(--leaf-100)">100</div>
    <div class="sw" style="background:var(--leaf-200)">200</div>
    <div class="sw" style="background:var(--leaf-300)">300</div>
    <div class="sw" style="background:var(--leaf-400)">400</div>
    <div class="sw" style="background:var(--leaf-500);outline:2px solid var(--fg-1);outline-offset:2px">500</div>
    <div class="sw dark" style="background:var(--leaf-600)">600</div>
    <div class="sw dark" style="background:var(--leaf-700)">700</div>
    <div class="sw dark" style="background:var(--leaf-800)">800</div>
    <div class="sw dark" style="background:var(--leaf-900)">900</div>
  </div>
</div>
<div class="group">
  <div class="label">Himmelblau · informational, links</div>
  <div class="row">
    <div class="sw" style="background:var(--sky-50)">50</div>
    <div class="sw" style="background:var(--sky-100)">100</div>
    <div class="sw" style="background:var(--sky-200)">200</div>
    <div class="sw" style="background:var(--sky-300)">300</div>
    <div class="sw" style="background:var(--sky-400)">400</div>
    <div class="sw" style="background:var(--sky-500)">500</div>
    <div class="sw dark" style="background:var(--sky-600);outline:2px solid var(--fg-1);outline-offset:2px">600</div>
    <div class="sw dark" style="background:var(--sky-700)">700</div>
    <div class="sw dark" style="background:var(--sky-800)">800</div>
    <div class="sw dark" style="background:var(--sky-900)">900</div>
  </div>
</div>
</body>
</html>
