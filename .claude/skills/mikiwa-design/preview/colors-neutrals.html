<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);}
  body{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;}
  .label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);}
  .row{display:flex;gap:6px;}
  .sw{width:62px;height:54px;border-radius:8px;border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--fg-1);}
  .sw.dark{color:var(--warm-50);}
</style>
</head>
<body>
<div class="label">Warm neutrals · papier feel — never pure gray</div>
<div class="row">
  <div class="sw" style="background:var(--warm-0);border-color:var(--warm-300)">0</div>
  <div class="sw" style="background:var(--warm-25)">25</div>
  <div class="sw" style="background:var(--warm-50)">50</div>
  <div class="sw" style="background:var(--warm-100)">100</div>
  <div class="sw" style="background:var(--warm-200)">200</div>
  <div class="sw" style="background:var(--warm-300)">300</div>
  <div class="sw" style="background:var(--warm-400)">400</div>
  <div class="sw dark" style="background:var(--warm-500)">500</div>
  <div class="sw dark" style="background:var(--warm-600)">600</div>
  <div class="sw dark" style="background:var(--warm-700)">700</div>
  <div class="sw dark" style="background:var(--warm-800)">800</div>
  <div class="sw dark" style="background:var(--warm-900)">900</div>
  <div class="sw dark" style="background:var(--warm-950)">950</div>
</div>
</body>
</html>
