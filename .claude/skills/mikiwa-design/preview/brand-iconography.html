<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);}
  body{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);width:90px;}
  .icon{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg-1);}
  .icon i{display:block;width:24px;height:24px;}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);}
  .icon.accent{color:var(--accent);}
</style>
</head>
<body>
<div class="row">
  <span class="label">Lucide</span>
  <span class="icon"><i data-lucide="calendar"></i><span class="name">calendar</span></span>
  <span class="icon"><i data-lucide="users"></i><span class="name">users</span></span>
  <span class="icon"><i data-lucide="sun"></i><span class="name">sun</span></span>
  <span class="icon"><i data-lucide="bell"></i><span class="name">bell</span></span>
  <span class="icon"><i data-lucide="check-circle-2"></i><span class="name">check</span></span>
  <span class="icon"><i data-lucide="message-circle"></i><span class="name">message</span></span>
  <span class="icon"><i data-lucide="settings"></i><span class="name">settings</span></span>
  <span class="icon"><i data-lucide="home"></i><span class="name">home</span></span>
  <span class="icon"><i data-lucide="image"></i><span class="name">image</span></span>
  <span class="icon"><i data-lucide="file-text"></i><span class="name">file</span></span>
</div>
<div class="row">
  <span class="label">Sizes</span>
  <span class="icon"><i data-lucide="sun" style="width:16px;height:16px"></i><span class="name">16</span></span>
  <span class="icon"><i data-lucide="sun" style="width:20px;height:20px"></i><span class="name">20</span></span>
  <span class="icon"><i data-lucide="sun"></i><span class="name">24</span></span>
  <span class="icon"><i data-lucide="sun" style="width:32px;height:32px"></i><span class="name">32</span></span>
  <span class="icon accent"><i data-lucide="sun" style="width:32px;height:32px"></i><span class="name">accent</span></span>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
