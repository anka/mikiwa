# nginx vhost for Mikiwa. After installing, run `certbot --nginx -d app.mikiwa.at`
# to add the SSL block and HTTP→HTTPS redirect (certbot edits this file in place).
# See docs/deployment.md §2.5.

server {
    listen 80;
    listen [::]:80;
    server_name app.mikiwa.at;

    access_log /var/log/nginx/mikiwa.access.log;
    error_log  /var/log/nginx/mikiwa.error.log;

    # Allow image uploads (gallery, shopping list photo import).
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Silence health-check noise in nginx access log.
    location = /up {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
