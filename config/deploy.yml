service: mikiwa
image: mikiwa/app

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST", "your-server-ip") %>

# Let's Encrypt SSL via Kamal Proxy
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "mikiwa.at") %>
  healthcheck:
    path: /up
    interval: 10
    timeout: 5

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info

volumes:
  - "mikiwa_storage:/rails/storage"
  - "mikiwa_backups:/var/backups/mikiwa"

asset_path: /rails/public/assets

builder:
  arch: amd64
  cache:
    type: gha

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"
  backup:  app exec --reuse "script/backup.sh"
